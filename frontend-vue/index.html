<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裏界箱庭</title>
    <script>
      try {
        const theme = localStorage.getItem('media-library-theme-mode') === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (localStorage.getItem('media-library-theme') === 'dark' ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { /* 存储不可用时沿用浅色。 */ }
    </script>
    <!-- 启动底色使用零优先级，完整样式加载后让出透明画布，避免盖住原生视频。 -->
    <style>:where(html,body){margin:0;background:#fafafa}:where(html[data-theme="dark"],html[data-theme="dark"] body){background:#1e2025}</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
